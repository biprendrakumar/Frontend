<script>
// ==========================
// Task 1: Functions, Closures & IIFE
// ==========================

// 1️⃣ Simple Function Example
function greet(name) {
  return "Hello, " + name;
}
console.log(greet("Alice"));



// 2️⃣ Closure Example
function counter() {
  let count = 0;

  return function() {
    count++;
    console.log("Count:", count);
  };
}

let increment = counter();
increment(); // 1
increment(); // 2
increment(); // 3



// 3️⃣ IIFE (Immediately Invoked Function Expression)
(function() {
  console.log("This runs immediately!");
})();



// 4️⃣ Closure Interview Question
function makeAdder(x) {
  return function(y) {
    return x + y;
  };
}

let add5 = makeAdder(5);
console.log(add5(10)); // Output: 15



// 5️⃣ Loop + Closure Interview Trick

// Without fix (prints 5 each time)
for (var i = 0; i < 5; i++) {
  setTimeout(() => console.log("i =", i), 1000);
}

// With closure fix using IIFE (prints 0–4)
for (var j = 0; j < 5; j++) {
  (function(num) {
    setTimeout(() => console.log("j =", num), 1000);
  })(j);
}

</script>
